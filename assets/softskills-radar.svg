<svg width="560" height="500" viewBox="0 0 560 500" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="560" height="500" fill="#060918" rx="16"/>

  <!-- Stars -->
  <circle cx="42" cy="30" r="1" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="510" cy="55" r="1.2" fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="440" r="0.8" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="490" cy="420" r="1" fill="white" opacity="0.25"><animate attributeName="opacity" values="0.25;0.7;0.25" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="530" cy="200" r="0.8" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="25" cy="280" r="1.1" fill="white" opacity="0.2"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="150" cy="20" r="0.9" fill="white" opacity="0.35"><animate attributeName="opacity" values="0.35;0.85;0.35" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="480" r="1" fill="white" opacity="0.2"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="55" cy="150" r="0.7" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="470" cy="140" r="1.2" fill="white" opacity="0.25"><animate attributeName="opacity" values="0.25;0.75;0.25" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="14" r="0.8" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="475" r="1" fill="white" opacity="0.2"><animate attributeName="opacity" values="0.2;0.65;0.2" dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="340" cy="465" r="0.8" fill="white" opacity="0.28"><animate attributeName="opacity" values="0.28;0.8;0.28" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="370" r="1" fill="white" opacity="0.22"><animate attributeName="opacity" values="0.22;0.65;0.22" dur="4.8s" repeatCount="indefinite"/></circle>

  <!-- Header -->
  <text x="280" y="30" text-anchor="middle" font-family="monospace" font-size="9" fill="rgba(120,170,255,0.5)" letter-spacing="4">&#x25C8; SOFT SKILLS &#x25C8;</text>
  <text x="280" y="52" text-anchor="middle" font-family="monospace" font-size="13" font-weight="bold" fill="#c8e0ff" letter-spacing="2">Skills Constellation</text>

  <!-- Grid rings (heptagon N=7, R=150) -->
  <polygon points="280,100 420,163 420,337 280,400 140,337 140,163" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.9"/>
  <polygon points="280,138 385,191 385,309 280,362 175,309 175,191" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.7"/>
  <polygon points="280,175 350,219 350,281 280,325 210,281 210,219" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.55"/>
  <polygon points="280,213 315,232 315,268 280,287 245,268 245,232" fill="none" stroke="#1a2a4a" stroke-width="0.5" opacity="0.4"/>

  <!-- Axis lines -->
  <line x1="280" y1="250" x2="280" y2="100" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="397" y2="157" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="426" y2="283" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="345" y2="385" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="215" y2="385" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="134" y2="283" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>
  <line x1="280" y1="250" x2="163" y2="157" stroke="#1e3050" stroke-width="0.5" opacity="0.6"/>

  <!-- Outer decorative ring -->
  <circle cx="280" cy="250" r="157" fill="none" stroke="#1e3a6a" stroke-width="0.5" stroke-dasharray="3 8" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 280 250" to="360 280 250" dur="35s" repeatCount="indefinite"/>
  </circle>

  <!-- Sweep line -->
  <line x1="280" y1="250" x2="280" y2="100" stroke="#a78bfa" stroke-width="1" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 280 250" to="360 280 250" dur="6s" repeatCount="indefinite"/>
  </line>

  <!-- Data polygon animated -->
  <polygon
    points="280,118 388,164 404,278 339,372 223,368 144,281 183,172"
    fill="rgba(167,139,250,0.18)" stroke="#a78bfa" stroke-width="1.5" opacity="0">
    <animate attributeName="opacity" values="0;0.92" dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
    <animate attributeName="points"
      values="280,250 280,250 280,250 280,250 280,250 280,250 280,250;280,118 388,164 404,278 339,372 223,368 144,281 183,172"
      dur="1.8s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.4 0 0.2 1"/>
  </polygon>

  <!-- Dot + pulse: Leadership (280,118) pink -->
  <circle cx="280" cy="118" r="5" fill="#f472b6" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="1.8s" fill="freeze"/></circle>
  <circle cx="280" cy="118" r="5" fill="none" stroke="#f472b6" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="1.8s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="1.8s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Positive attitude (388,164) green -->
  <circle cx="388" cy="164" r="5" fill="#34d399" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2s" fill="freeze"/></circle>
  <circle cx="388" cy="164" r="5" fill="none" stroke="#34d399" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="2.1s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="2.1s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Communication (404,278) blue -->
  <circle cx="404" cy="278" r="5" fill="#60a8ff" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2.1s" fill="freeze"/></circle>
  <circle cx="404" cy="278" r="5" fill="none" stroke="#60a8ff" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="2.4s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Problem solving (339,372) amber -->
  <circle cx="339" cy="372" r="5" fill="#fbbf24" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2.2s" fill="freeze"/></circle>
  <circle cx="339" cy="372" r="5" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="2.7s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="2.7s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Adaptability (223,368) purple -->
  <circle cx="223" cy="368" r="5" fill="#a78bfa" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2.3s" fill="freeze"/></circle>
  <circle cx="223" cy="368" r="5" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="3s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="3s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Accountability (144,281) red -->
  <circle cx="144" cy="281" r="5" fill="#f87171" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2.4s" fill="freeze"/></circle>
  <circle cx="144" cy="281" r="5" fill="none" stroke="#f87171" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="3.3s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="3.3s" repeatCount="indefinite"/></circle>

  <!-- Dot + pulse: Competitiveness (183,172) cyan -->
  <circle cx="183" cy="172" r="5" fill="#38bdf8" opacity="0"><animate attributeName="opacity" values="0;0.95" dur="0.3s" begin="2.5s" fill="freeze"/></circle>
  <circle cx="183" cy="172" r="5" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0"><animate attributeName="opacity" values="0;0.7;0" dur="3s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="r" values="5;14;5" dur="3s" begin="3.6s" repeatCount="indefinite"/></circle>

  <!-- Center dot -->
  <circle cx="280" cy="250" r="3" fill="#a78bfa" opacity="0.9"/>
  <circle cx="280" cy="250" r="7" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.4"/>

  <!-- Labels -->
  <text x="280" y="86" text-anchor="middle" font-family="monospace" font-size="11" fill="#f472b6" opacity="0.95">Leadership</text>
  <text x="422" y="144" text-anchor="start" font-family="monospace" font-size="11" fill="#34d399" opacity="0.95">Positive attitude</text>
  <text x="418" y="278" text-anchor="start" font-family="monospace" font-size="11" fill="#60a8ff" opacity="0.95">Communication</text>
  <text x="342" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#fbbf24" opacity="0.95">Problem solving</text>
  <text x="218" y="400" text-anchor="middle" font-family="monospace" font-size="11" fill="#a78bfa" opacity="0.95">Adaptability</text>
  <text x="130" y="278" text-anchor="end" font-family="monospace" font-size="11" fill="#f87171" opacity="0.95">Accountability</text>
  <text x="168" y="144" text-anchor="end" font-family="monospace" font-size="11" fill="#38bdf8" opacity="0.95">Competitiveness</text>

  <!-- Border -->
  <rect width="560" height="500" fill="none" stroke="rgba(80,130,255,0.2)" stroke-width="1" rx="16"/>
</svg>
